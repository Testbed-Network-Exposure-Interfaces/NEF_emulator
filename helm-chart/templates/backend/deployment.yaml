{{- if and .Values.backend.enabled .Values.rabbitmq.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Values.backend.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.backend.name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Values.backend.name }}
    spec:
      # capif.host is the hostname CAPIF's nginx serves its cert for, and it is
      # not resolvable by anything (no DNS zone, not a Service name) - map it
      # to capif.ingressIP here, as CAPIF itself does for its register pod.
      {{- if and .Values.capif.enabled .Values.capif.ingressIP }}
      hostAliases:
      - ip: {{ .Values.capif.ingressIP | quote }}
        hostnames:
        - {{ .Values.capif.host | quote }}
      {{- end }}
      {{- if .Values.capif.enabled }}
      {{- with .Values.capif.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      # depends on rabbitmq
      initContainers:
      - name: wait-for-rabbitmq
        image: busybox
        command: [ 'sh', '-c', 'until wget http://guest:guest@{{ .Release.Name }}-{{ .Values.rabbitmq.name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ index .Values.rabbitmq.service.ports 1 "port" }}/api/aliveness-test/%2F; do echo waiting for rabbitmq; sleep 2; done;' ]
      {{- if .Values.capif.enabled }}
      # Populates/prepares the shared hostPath directory (permissions) before
      # the backend writes its CAPIF onboarding certs into it at startup.
      - name: prepare-capif-certs-dir
        image: busybox
        command: [ 'sh', '-c', 'mkdir -p /capif-certs && chmod -R 0777 /capif-certs' ]
        volumeMounts:
        - name: capif-certs
          mountPath: /capif-certs
      {{- end }}
      containers:
      - name: {{ .Values.backend.name }}
        image: {{ .Values.backend.deployment.image }}
        command: ["/start-reload.sh"]
        {{- if .Values.backend.deployment.ports }}
        ports:
          {{- toYaml .Values.backend.deployment.ports | nindent 12 }}
        {{- end }}
        volumeMounts:
          # - name: backend-app
          #   mountPath: /app
          - name: shared-data
            mountPath: /shared
          {{- if .Values.capif.enabled }}
          - name: capif-certs
            mountPath: /app/app/capif/certificates
          {{- end }}
        env:
          - name: SERVER_NAME
            valueFrom:
              configMapKeyRef:
                name: {{ .Release.Name }}-{{ .Values.configName }}
                key: DOMAIN
          - name: SERVER_HOST
            value: "https://$(SERVER_NAME)"
          - name: MONGO_URL
            value: mongodb://{{ .Release.Name }}-{{ .Values.mongo.name }}:{{ index .Values.mongo.service.ports 0 "port" }}/
          - name: RABBITMQ_HOST
            value: {{ .Release.Name }}-{{ .Values.rabbitmq.name }}
          {{- with .Values.backend.extraEnv }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        envFrom:
        - secretRef:
            name: {{ .Release.Name }}-{{ .Values.secretsName }}
        - configMapRef:
            name: {{ .Release.Name }}-{{ .Values.configName }}
      volumes:
        # - name: backend-app
        #   persistentVolumeClaim:
        #     claimName: backend-app
        - name: shared-data
          persistentVolumeClaim:
            claimName: shared-data
        {{- if .Values.capif.enabled }}
        - name: capif-certs
          hostPath:
            path: {{ .Values.capif.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
{{- end }}
