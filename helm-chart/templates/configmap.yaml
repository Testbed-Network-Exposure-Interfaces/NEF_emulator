apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-{{ .Values.configName }}
data:
  # ENVIROMENT VARIABLES
  DOMAIN: {{ .Release.Name }}-{{ .Values.backend.name }}
  DOCKER_IMAGE_BACKEND: "backend"
  DOCKER_IMAGE_FRONTEND: "frontend"
  DOCKER_IMAGE_REPORT: "report"
  DOCKER_IMAGE_PRODUCER: "producer"
  # Backend
  SERVER_NAME: ""
  SERVER_HOST: "{{ .Release.Name }}-{{ .Values.backend.name }}"
  SERVER_PORT: '{{ index .Values.backend.deployment.ports 0 "containerPort" }}'
  BACKEND_CORS_ORIGINS: '["https://5g-api-emulator.medianetlab.eu","http://localhost", "http://{{ .Release.Name }}-{{ .Values.backend.name }}"]'
  PROJECT_NAME: "NEF_Emulator"
  FIRST_SUPERUSER: "admin@my-email.com"
  SMTP_TLS: "True"
  SMTP_PORT: "465"
  SMTP_HOST: "mail.host.com"
  SMTP_USER: "user"
  EMAILS_FROM_EMAIL: "user@my-email.com"
  SENTRY_DSN: ""
  USERS_OPEN_REGISTRATION: "true"

  # NGINX (important for CAPIF integration)
  NGINX_HOST: "10.255.28.207"  # TO BE REMOVED LATER
  NGINX_HTTP: '{{ index .Values.nginx.service.ports 0 "port" }}'
  NGINX_HTTPS: '{{ index .Values.nginx.service.ports 1 "port" }}'
  # nginx proxy_pass target: the backend's Service name/port (not the
  # container port), since nginx talks to the backend through its Service.
  NGINX_BACKEND_HOST: {{ .Release.Name }}-{{ .Values.backend.name }}
  NGINX_BACKEND_PORT: '{{ index .Values.backend.service.ports 0 "port" }}'

  # CAPIF
  CAPIF_ENABLED: {{ .Values.capif.enabled | quote }}
  CAPIF_CLEANUP_ON_SHUTDOWN: {{ .Values.capif.cleanupOnShutdown | quote }}
  {{- if .Values.capif.enabled }}
  CAPIF_HOST: {{ .Values.capif.host | quote }}
  REGISTER_HOST: {{ .Values.capif.registerHost | quote }}
  CAPIF_HTTPS_PORT: {{ .Values.capif.httpsPort | quote }}
  CAPIF_REGISTER_PORT: {{ .Values.capif.registerPort | quote }}
  CAPIF_USERNAME: {{ .Values.capif.username | quote }}
  {{- end }}

  # Postgres
  # info: POSTGRES_USER value ('postgres') is hard-coded in /pgadmin/servers.json
  POSTGRES_SERVER: {{ .Release.Name }}-{{ .Values.postgres.name }}
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "app"

  # PgAdmin
  PGADMIN_LISTEN_PORT: "{{ index .Values.pgadmin.deployment.ports 0 "containerPort" }}"
  PGADMIN_DEFAULT_EMAIL: "admin@my-email.com"

  # Mongo 
  MONGO_USER: "root"

  # MongoExpress
  MONGO_EXPRESS_ENABLE_ADMIN: "true"

  #Report
  REPORT_PATH: "../shared/report.json"
  