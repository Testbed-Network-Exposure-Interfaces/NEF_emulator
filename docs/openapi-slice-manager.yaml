    SliceResponse:
      type: object
      description: Response envelope containing one `Slice`.
      additionalProperties: false
      required:
        - slice
      properties:
        slice:
          $ref: "#/components/schemas/Slice"
      example:
        slice:
          slice_id: "embb-slice"
          sst: 1
          sd: "020202"
          dnn: "embb"

    SliceListResponse:
      type: object
      description: |
        Response envelope containing multiple `Slice` entries.

        A response may include several slices with the same `dnn` and `snssai`
        and different `slice_id` values. Each `slice_id` selects a different
        **DNN QoS template**.
      additionalProperties: false
      required:
        - slices
      properties:
        slices:
          type: array
          items:
            $ref: "#/components/schemas/Slice"
      example:
        slices:
          - slice_id: "embb-slice-high"
            sst: 1
            sd: "020202"
            dnn: "embb"
          - slice_id: "embb-slice-low"
            sst: 1
            sd: "020202"
            dnn: "embb"
          - slice_id: "urllc-slice"
            sst: 2
            sd: "030303"
            dnn: "urllc"

    UeSliceAssociationCreateRequest:
      type: object
      description: |
        Client request for associating a UE with a slice profile.

        The `dnn`, `snssai`, and `slice_id` fields select the UDM **DNN QoS
        template** to assign to the UE.
      additionalProperties: false
      required:
        - dnn
        - snssai
        - slice_id
      properties:
        dnn:
          type: string
          minLength: 3
          description: "`dnn` value used to select the UDM **DNN QoS template**."
        snssai:
          type: string
          pattern: '^[0-9]{1,3}-[0-9]{6}$'
          description: "`snssai` value used to select the UDM **DNN QoS template**."
        slice_id:
          type: string
          minLength: 3
          description: Slice identifier and QoS profile selector matching `Slice.slice_id`.
        static_ipv4_address:
          type: string
          description: Static IPv4 address assigned to the UE.
          pattern: "^((25[0-5]|(2[0-4]|1\\d|[1-9]|)\\d)\\.?\\b){4}$"
          example: 10.16.9.5
        access_mobility_data:
          type: boolean
          description: Whether to create or update UDM Access and Mobility data for the UE.
        snssai_advertisement_allowed:
          type: boolean
          description: Whether the UE is allowed to receive the configured `snssai`.
        uplink_aggregate_maximum_bitrate_kbps:
          type: integer
          description: Uplink aggregate maximum bitrate for the UE, in kbps.
          x-unit: kbps
        downlink_aggregate_maximum_bitrate_kbps:
          type: integer
          description: Downlink aggregate maximum bitrate for the UE, in kbps.
          x-unit: kbps
      example:
        slice_id: "embb-slice"
        snssai: "1-020202"
        dnn: "embb"
        static_ipv4_address: "10.16.9.5"
        access_mobility_data: true
        uplink_aggregate_maximum_bitrate_kbps: 1000
        downlink_aggregate_maximum_bitrate_kbps: 3000

    UeSliceAssociationUpdateRequest:
      type: object
      description: |
        Fields used to modify a UE slice association.

        The `dnn`, `snssai`, and `slice_id` fields select the target **DNN QoS
        template** for the UE.
      additionalProperties: false
      required:
        - dnn
        - snssai
        - slice_id
      properties:
        dnn:
          type: string
          minLength: 3
          description: Target DNN.
        snssai:
          type: string
          pattern: '^[0-9]{1,3}-[0-9]{6}$'
          description: Target S-NSSAI.
        slice_id:
          type: string
          minLength: 3
          description: Target slice identifier and QoS profile selector.
      example:
        dnn: "embb"
        snssai: "1-020202"
        slice_id: "embb-slice-low"

    UeSliceAssociation:
      type: object
      description: |
        Observed UE slice association.

        The association records the selected `dnn`, `snssai`, and `slice_id`
        values, plus the resolved UDM **DNN QoS template** identity when
        available.
      additionalProperties: false
      required:
        - ue_id
        - dnn
        - snssai
        - slice_id
      properties:
        ue_id:
          $ref: "#/components/schemas/Imsi"
        dnn:
          type: string
          minLength: 3
          description: DNN associated with the UE.
        snssai:
          type: string
          pattern: '^[0-9]{1,3}-[0-9]{6}$'
          description: S-NSSAI associated with the UE.
        slice_id:
          type: string
          minLength: 3
          description: Slice identifier and QoS profile selector matching `Slice.slice_id`.
        dnn_qos_template_id:
          type: integer
          description: Numeric UDM **DNN QoS template** identifier resolved from UDM state.
        dnn_qos_template_name:
          type: string
          description: UDM **DNN QoS template** name resolved from UDM state.
        static_ipv4_address:
          type: string
          description: Static IPv4 address assigned to the UE.
        access_mobility_data:
          type: boolean
          description: Whether UDM Access and Mobility data is configured for the UE.
        snssai_advertisement_allowed:
          type: boolean
          description: Whether the UE is allowed to receive the configured `snssai`.
        uplink_aggregate_maximum_bitrate_kbps:
          type: integer
          description: Uplink aggregate maximum bitrate for the UE, in kbps.
          x-unit: kbps
        downlink_aggregate_maximum_bitrate_kbps:
          type: integer
          description: Downlink aggregate maximum bitrate for the UE, in kbps.
          x-unit: kbps
      example:
        ue_id: "268010123456789"
        dnn: "embb"
        snssai: "1-020202"
        slice_id: "embb-slice"
        dnn_qos_template_id: 1000
        dnn_qos_template_name: "embb_1-020202_embb-slice"
        static_ipv4_address: "10.16.9.5"
        access_mobility_data: true
        snssai_advertisement_allowed: false
        uplink_aggregate_maximum_bitrate_kbps: 1000
        downlink_aggregate_maximum_bitrate_kbps: 1000

    UeSliceAssociationResponse:
      type: object
      description: |
        Response envelope containing one UE slice association.
      additionalProperties: false
      required:
        - association
      properties:
        association:
          $ref: "#/components/schemas/UeSliceAssociation"
      example:
        association:
          ue_id: "268010123456789"
          dnn: "embb"
          snssai: "1-020202"
          slice_id: "embb-slice"
          dnn_qos_template_id: 1000
          dnn_qos_template_name: "embb_1-020202_embb-slice"

    UeSliceAssociationListResponse:
