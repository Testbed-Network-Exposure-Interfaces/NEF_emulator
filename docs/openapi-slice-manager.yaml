        downlink_latency_ms:
          type: integer
          description: Downlink latency budget, in milliseconds.
          x-unit: ms
        uplink_latency_ms:
          type: integer
          description: Uplink latency budget, in milliseconds.
          x-unit: ms
        uplink_deterministic_communication:
          type: string
          enum: [SUPPORTED, NOT_SUPPORTED]
        uplink_deterministic_periodicity:
          type: integer
        downlink_guaranteed_bitrate_per_ue_kbps:
          type: integer
          description: Downlink guaranteed bitrate per UE, in kbps.
          x-unit: kbps
        uplink_guaranteed_bitrate_per_ue_kbps:
          type: integer
          description: Uplink guaranteed bitrate per UE, in kbps.
          x-unit: kbps
        downlink_maximum_bitrate_per_ue_kbps:
          type: integer
          description: Downlink maximum bitrate per UE, in kbps.
          x-unit: kbps
        uplink_maximum_bitrate_per_ue_kbps:
          type: integer
          description: Uplink maximum bitrate per UE, in kbps.
          x-unit: kbps
        downlink_guaranteed_bitrate_per_slice_kbps:
          type: integer
          description: Downlink guaranteed bitrate per slice, in kbps.
          x-unit: kbps
        uplink_guaranteed_bitrate_per_slice_kbps:
          type: integer
          description: Uplink guaranteed bitrate per slice, in kbps.
          x-unit: kbps
        downlink_maximum_bitrate_per_slice_kbps:
          type: integer
          description: Downlink maximum bitrate per slice, in kbps.
          x-unit: kbps
        uplink_maximum_bitrate_per_slice_kbps:
          type: integer
