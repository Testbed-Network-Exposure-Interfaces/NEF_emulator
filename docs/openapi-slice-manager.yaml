          type: string
          description: Negotiated session AMBR uplink (detailed view only).
        ambr_downlink:
          type: string
          description: Negotiated session AMBR downlink (detailed view only).
        pdu_session_type:
          type: string
        ssc_mode:
          type: string
        user_ip_type:
          type: string
        user_ip:
          type: string
      example:
        imsi: "999080100001150"
        dnn: "test"
        five_qi: "6"
        snssai: "1/333333"
        ssc_mode: "1"
        user_ip_type: "IPv4"
        user_ip: "10.16.9.19"

    UePduSessionResponse:
      type: object
      additionalProperties: false
      description: Response envelope containing one `UePduSession`.
      required:
        - pdu_session
      properties:
        pdu_session:
          $ref: "#/components/schemas/UePduSession"

    BbuListResponse:
      type: object
      additionalProperties: false
      description: Response envelope containing all known BBUs.
      required:
        - bbus
      properties:
        bbus:
          type: array
          items:
            $ref: "#/components/schemas/Bbu"
          example:
            - bbu_id: bbu-99904
              location: muttley
              plmn_id: "99904"
              ip_address: 10.255.0.1
              status: Available
            - bbu_id: bbu-99903
              location: penelope
              plmn_id: "99903"
              ip_address: 10.255.0.1
              status: Available
            - bbu_id: aveiro-seaport
              location: aveiro-seaport
              plmn_id: "99908"
              ip_address: 10.255.0.1
              status: Unavailable

    CellUpdateRequest:
      type: object
      description: |
        Cell update payload.

        Include `operation`, `properties`, or both.
      additionalProperties: false
      anyOf:
        - required: [operation]
        - required: [properties]
      properties:
        operation:
          description: Allowed state operation for a cell.
          type: string
          enum:
            - activate
            - deactivate
          example: activate
        properties:
          $ref: "#/components/schemas/CellProperties"

    CellBulkUpdateRequest:
      type: object
      additionalProperties: false
      description: Bulk update payload for multiple cells in a BBU.
      required:
        - cell_ids
      anyOf:
        - required: [operation]
        - required: [properties]
      properties:
        cell_ids:
          type: array
          minItems: 1
          items:
            type: integer
          example: [151, 152]
        operation:
          description: Allowed state operation for each selected cell.
          type: string
          enum:
            - activate
            - deactivate
          example: activate
        properties:
          $ref: "#/components/schemas/CellProperties"

    CellStatusResponse:
      type: object
      additionalProperties: false
      description: Response envelope containing one cell status.
      required:
        - cell
      properties:
        cell:
          $ref: "#/components/schemas/CellStatus"

    CellStatusListResponse:
      type: object
      additionalProperties: false
      description: Response envelope containing cell statuses for one BBU.
      required:
        - cells
      properties:
        cells:
          type: array
          items:
            $ref: "#/components/schemas/CellStatus"
          example:
            - nr_cell_id: 151
              frequency_band: n78
              duplex_mode: TDD
              user_label: muttley
              activation_state: Activated
              max_transmit_power: 242
            - nr_cell_id: 152
              frequency_band: n78
              duplex_mode: TDD
              user_label: penelope
              activation_state: Deactivated
              max_transmit_power: 70
            - nr_cell_id: 153
              frequency_band: n78
              duplex_mode: TDD
              user_label: it
              activation_state: Activated
              max_transmit_power: 180
