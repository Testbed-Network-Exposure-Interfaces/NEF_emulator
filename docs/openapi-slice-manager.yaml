          - ue_id: "268010123456789"
            dnn: "embb"
            snssai: "1-020202"
            slice_id: "embb-slice-low"
            dnn_qos_template_id: 1001
            dnn_qos_template_name: "embb_1-020202_embb-slice-low"

    UeControlInfo:
      type: object
