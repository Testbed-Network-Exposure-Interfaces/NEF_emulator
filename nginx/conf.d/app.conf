server {
    listen 80;
    server_name _;
    return 301 https://${DOLLAR}host:${NGINX_HTTPS}${DOLLAR}request_uri;
}



server {
    listen 443 ssl;

    ssl_certificate         ${NGINX_SSL_CERT_PATH};
    ssl_certificate_key     ${NGINX_SSL_CERT_KEY_PATH};
    ssl_client_certificate  ${NGINX_SSL_CLIENT_CERT_PATH};
    ssl_verify_client       ${NGINX_SSL_VERIFY_CLIENT};

    location / {
        if (${DOLLAR}ssl_client_verify ${NGINX_TLS_CONDITION}) {
            return 403;
        }
        proxy_set_header X-SSL-Client-Cert ${DOLLAR}ssl_client_escaped_cert;
        proxy_pass http://${NGINX_BACKEND_HOST}:${NGINX_BACKEND_PORT}/;
    }
}

